[target.riscv32imac-unknown-none-elf]
rustflags = [
    "-C", "force-frame-pointers",    # required by esp-backtrace frame walks
]
runner = "espflash flash --monitor"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"

[alias]
# Alias args are not shell-parsed; do not wrap --config in extra quotes.
b-c6 = "build -p ossm-esp32 --config=unstable.build-std=[\"core\",\"alloc\"] --target riscv32imac-unknown-none-elf --features esp32c6 --no-default-features"
b-s3 = "build -p ossm-esp32 --config=unstable.build-std=[\"core\",\"alloc\"] --target xtensa-esp32s3-none-elf --features esp32s3 --no-default-features"
