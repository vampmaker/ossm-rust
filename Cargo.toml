[package]
name = "ossm-rust"
version = "0.1.0"
authors = ["vampmaker <vampmaker@outlook.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.77"

[[bin]]
name = "ossm-rust"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"
# Symbols stay in the ELF (not flashed to the chip), so crash addresses can
# still be decoded with addr2line at no cost to on-device size or speed.
debug = true
# Keep panics on integer overflow instead of silent wrapping.
overflow-checks = true

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }

embassy-executor = { version = "0.10", features = ["executor-thread", "platform-std"] }
# generic-queue-8: the HTTP server runs via block_on on its own thread (not the
# Embassy executor), so embassy-time timers need the generic timer queue.
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embassy-sync = "0.8"
embassy-futures = "0.1"
static_cell = "2"

edge-http = { version = "0.8", features = ["std"] }
edge-nal = "0.7"
edge-nal-std = { version = "0.7", features = ["async-io-mini"], default-features = false }
edge-ws = { version = "0.8", features = ["io"] }

rmodbus = { version = "0.9.10", features = ["fixedvec"] }
anyhow = "1.0.100"
fixedvec = "0.2.4"
heapless = "0.9"
serde = "1.0.228"
serde_json = "1.0.145"
esp-idf-sys = "0.37"
libm = "0.2.8"
embedded-cli = "0.2.1"
embedded-io = { version = "0.6.1", features = ["std"] }
embedded-io-async = "0.7"

[build-dependencies]
embuild = "0.33"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(esp32c6)', 'cfg(esp32s3)'] }
