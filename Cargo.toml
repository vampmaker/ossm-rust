[workspace]
resolver = "2"
members = ["crates/ossm-core", "crates/ossm-esp32", "crates/ossm-std"]
default-members = ["crates/ossm-esp32"]

[profile.release]
opt-level = 2
debug = true
overflow-checks = true
lto = false

[profile.dev]
debug = true
opt-level = "z"

[profile.dev.package.esp-radio]
opt-level = 3
