[package]
name = "ossm-rust"
version = "0.2.0"
authors = ["vampmaker <vampmaker@outlook.com>"]
edition = "2021"
resolver = "2"

[[bin]]
name = "ossm-rust"
harness = false

[profile.release]
opt-level = 2
debug = true
overflow-checks = true
lto = false

[profile.dev]
debug = true
opt-level = "z"

[profile.dev.package.esp-radio]
opt-level = 3

[features]
default = ["esp32c6"]
# Enable per-byte UART receive timing diagnostics (logs BYTE_DIAG lines via log::info!).
# Build with: cargo b-c6 --release --features byte-timing-diag
byte-timing-diag = []
esp32c6 = [
    "esp-hal/esp32c6",
    "esp-rtos/esp32c6",
    "esp-radio/esp32c6",
    "esp-storage/esp32c6",
    "esp-nvs/esp32c6",
    "esp-alloc/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-println/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
]
esp32s3 = [
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-radio/esp32s3",
    "esp-storage/esp32s3",
    "esp-nvs/esp32s3",
    "esp-alloc/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-println/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
]

[dependencies]
esp-hal = { version = "1.1", features = ["unstable", "rt", "log-04"] }
esp-rtos = { version = "0.3", features = ["embassy", "esp-radio", "esp-alloc", "log-04"] }
esp-radio = { version = "1.0.0-beta.0", features = ["wifi", "ble", "coex", "unstable", "log-04"] }
esp-alloc = { version = "0.10", features = ["nightly"] }
# Unwind for our custom #[panic_handler]. Do not enable panic-handler /
# exception-handler (those clash with console::panic / esp-hal). esp-println is
# required by esp-backtrace's build gate only — never init it as the logger.
esp-backtrace = { version = "0.15", default-features = false, features = ["println"] }
esp-println = { version = "0.13", default-features = false, features = ["jtag-serial", "critical-section"] }
rtt-target = "0.6"

esp-storage = "0.8"
esp-nvs = "0.4"
esp-bootloader-esp-idf = "0.5.0"

embassy-executor = { version = "0.10" }
embassy-time = "0.5"
embassy-sync = "0.7"
embassy-futures = "0.1"
embassy-net = { version = "0.9", features = ["tcp", "dhcpv4", "medium-ethernet", "dns"] }
static_cell = "2"

edge-http = { version = "0.8", default-features = false, features = ["io"] }
edge-nal = { version = "0.7", default-features = false }
edge-nal-embassy = { version = "0.9", default-features = false, features = ["tcp", "proto-ipv4", "medium-ethernet"] }
edge-ws = { version = "0.8", default-features = false, features = ["io"] }

trouble-host = { version = "0.6", features = ["gatt", "derive", "peripheral"] }
bt-hci = { version = "0.8", features = ["uuid"] }

rmodbus = { version = "0.9", default-features = false, features = ["fixedvec"] }
fixedvec = "0.2"

serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde-json-core = "0.6"

heapless = "0.9"
embedded-cli = "0.2"
embedded-io = "0.6"
embedded-io-async = "0.7"
libm = "0.2"
log = "0.4"
critical-section = "1.2"
portable-atomic = "1.6"

[build-dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(esp32c6)', 'cfg(esp32s3)'] }
