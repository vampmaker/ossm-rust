[package]
name = "ossm-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Pure OSSM motion/config/RPC types (no_std + alloc)"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
rmodbus = { version = "0.9", default-features = false, features = ["fixedvec"] }
fixedvec = "0.2"
libm = "0.2"
log = "0.4"
serde-json-core = "0.6"
ossm-common = { path = "../ossm-common" }
