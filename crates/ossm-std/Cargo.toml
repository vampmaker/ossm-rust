[package]
name = "ossm-std"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Desktop OSSM shell (tokio + axum) around ossm-core"

[[bin]]
name = "ossm-std"
path = "src/main.rs"

[dependencies]
ossm-core = { path = "../ossm-core" }
ossm-common = { path = "../ossm-common" }
tokio = { version = "1", features = ["full"] }
tokio-serial = { version = "5.4", default-features = false }
serialport = { version = "4", default-features = false }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmodbus = { version = "0.9", default-features = false, features = ["fixedvec"] }
fixedvec = "0.2"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
url = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
md-5 = "0.10"
regex = "1"

[target.'cfg(target_os = "linux")'.dependencies]
android-usb-serial = { version = "0.1.1", default-features = false }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_Media",
] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
android-usb-serial = { version = "0.1.1", default-features = false, features = ["fake-transport"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
